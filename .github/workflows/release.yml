name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          bin=uauthn
          [ "$GOOS" = windows ] && bin=uauthn.exe
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "$bin" ./cmd/uauthn
          out="uauthn-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then
            zip "$out.zip" "$bin" index.html README.md README.ja.md LICENSE
          else
            tar czf "$out.tar.gz" "$bin" index.html README.md README.ja.md LICENSE
          fi
      - name: extract changelog
        run: awk '/^## \[/{if(p)exit; p=1} p' CHANGELOG.md > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            uauthn-*.tar.gz
            uauthn-*.zip
